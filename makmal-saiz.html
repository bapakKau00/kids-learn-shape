<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Makmal Saiz - Shape Eby! 🕵️‍♂️</title>
    <link rel="icon" type="image/png" href="assets/images/shapes.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Coiny&family=Open+Sans:wght@300..800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('assets/images/page 4.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
            color: white;
        }

        .overlay-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
            pointer-events: none;
        }

        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #ff4081;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s;
            z-index: 20;
        }

        .back-button:hover {
            transform: translateY(-3px) scale(1.05);
        }

        .instruction-tag {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 40px;
            border-radius: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            color: #9C27B0;
            font-size: 2rem;
            border: 4px solid #9C27B0;
            text-align: center;
            animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .progress-container {
            position: absolute;
            top: 130px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .progress-dot {
            width: 25px;
            height: 25px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            border: 3px solid white;
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #FFEB3B;
            transform: scale(1.3);
            box-shadow: 0 0 15px #FFEB3B;
        }

        .progress-dot.completed {
            background: #4CAF50;
        }

        .game-area {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            width: 80%;
            max-width: 1000px;
            height: 60%;
            margin-top: 50px;
            z-index: 5;
        }

        .option-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .option-container:hover {
            transform: scale(1.05);
        }

        .option-container:active {
            transform: scale(0.95);
        }

        .pedestal {
            width: 320px;
            height: 60px;
            background: #ffffff;
            border-radius: 50% / 20%;
            border-bottom: 20px solid #cfd8dc;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .item-box {
            width: 250px;
            height: 250px;
            background: #ffffff;
            border: 8px solid #D77D14;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            bottom: 40px;
            box-shadow: 0 10px 0 #cfd8dc;
            transition: transform 0.3s;
        }

        .item {
            font-size: 180px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
            transition: all 0.5s ease;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .item img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        .item.small {
            transform: scale(0.65);
        }

        .item.medium {
            transform: scale(0.9);
        }

        .item.large {
            transform: scale(1.15);
        }

        .label-tag {
            background: #333;
            color: white;
            padding: 5px 20px;
            border-radius: 10px;
            font-size: 1.2rem;
            margin-top: 15px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.2);
        }

        /* Learning Popup */
        .learning-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .learning-popup {
            background: white;
            padding: 40px;
            border-radius: 40px;
            border: 10px solid #9C27B0;
            width: 80%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #333;
        }

        .learning-popup h2 {
            color: #9C27B0;
            font-size: 3.5rem;
            margin: 0 0 20px 0;
            font-family: 'Coiny', cursive;
        }

        .btn-continue {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 30px;
            font-size: 2rem;
            font-family: 'Coiny', cursive;
            cursor: pointer;
            box-shadow: 0 8px 0 #2E7D32;
            margin-top: 30px;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        @keyframes popUp {
            from { transform: scale(0.5) translateY(100px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10rem;
            opacity: 0;
            transition: all 0.3s;
        }

        .feedback-overlay.show {
            opacity: 1;
            transform: scale(1.2);
        }
    </style>
</head>

<body>
    <div class="overlay-bg"></div>
    <a href="final-celebration.html" class="back-button">Kembali</a>

    <div class="header">
        <div class="instruction-tag" id="question-text">Pilih item yang BESAR!</div>
    </div>

    <div class="progress-container">
        <div class="progress-dot active"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
    </div>

    <div class="game-area">
        <div class="option-container" id="option-1" onclick="checkAnswer(0)">
            <div class="pedestal">
                <div class="item-box">
                    <div class="item" id="item-1">📚</div>
                </div>
            </div>
            <div class="label-tag" id="label-1">Buku Teks</div>
        </div>
        <div class="option-container" id="option-2" onclick="checkAnswer(1)">
            <div class="pedestal">
                <div class="item-box">
                    <div class="item" id="item-2">📔</div>
                </div>
            </div>
            <div class="label-tag" id="label-2">Buku Nota</div>
        </div>
    </div>

    <div class="feedback-overlay" id="feedback-overlay">✅</div>

    <!-- Audio Feedback -->
    <audio id="sound-correct" src="assets/audio/catch correct.mp3"></audio>
    <audio id="sound-wrong" src="assets/audio/wrong catch.mp3"></audio>
    <audio id="sound-yay" src="assets/audio/yayyy-sound.mp3"></audio>

    <!-- Mission 2 Voice Overs -->
    <audio id="vo-buku" src="assets/audio/misi 2/buku teks.ogg"></audio>
    <audio id="vo-pembaris" src="assets/audio/misi 2/pembaris.ogg"></audio>
    <audio id="vo-kerusi" src="assets/audio/misi 2/kerusi.ogg"></audio>
    <audio id="vo-meja" src="assets/audio/misi 2/meja.ogg"></audio>
    <audio id="vo-tahniah" src="assets/audio/misi 2/tahniah.ogg"></audio>

    <div class="learning-popup-overlay" id="victory-popup">
        <div class="learning-popup">
            <h2>TAHNIAH!</h2>
            <p style="font-size: 1.5rem;">Kamu sudah menguasai kemahiran membezakan saiz di Makmal Saiz! 🧪🔍🏆</p>
            <div style="font-size: 4rem; margin: 20px 0;">📏📏</div>
            <p style="font-size: 1.2rem; font-family: 'Open Sans', sans-serif;">Ingat! Saiz membantu kita mengenali benda di sekeliling kita dengan lebih tepat.</p>
            <button class="btn-continue" onclick="window.location.href='next.html'">Selesai! ✨</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                text: "Antara Buku Teks dan Buku Nota, mana yang lebih BESAR?",
                audioId: "vo-buku",
                options: [
                    { content: "assets/images/textbook.webp", label: "Buku Teks", size: "large", type: "img", correct: true },
                    { content: "assets/images/buku nota.png", label: "Buku Nota", size: "small", type: "img", correct: false }
                ]
            },
            {
                text: "Antara dua pembaris ini, mana yang lebih KECIL / PENDEK?",
                audioId: "vo-pembaris",
                options: [
                    { content: "assets/images/pembaris plastik.png", label: "Pembaris Plastik", size: "large", type: "img", correct: true },
                    { content: "assets/images/pembaris kayu.png", label: "Pembaris Kayu", size: "small", type: "img", correct: false }
                ]
            },
            {
                text: "Antara dua kerusi ini, mana yang lebih BESAR?",
                audioId: "vo-kerusi",
                options: [
                    { content: "assets/images/kerusi kayu.png", label: "Kerusi Kayu", size: "medium", type: "img", correct: true },
                    { content: "assets/images/kerusi plastik.png", label: "Kerusi Plastik", size: "small", type: "img", correct: false }
                ]
            },
            {
                text: "Antara dua meja ini, mana yang lebih LUAS / BESAR?",
                audioId: "vo-meja",
                options: [
                    { content: "assets/images/meja kayu.png", label: "Meja Kayu", size: "medium", type: "img", correct: true },
                    { content: "assets/images/meja plastik.png", label: "Meja Lipat", size: "small", type: "img", correct: false }
                ]
            }
        ];

        let currentQuestion = 0;
        let canClick = true;

        const soundCorrect = document.getElementById('sound-correct');
        const soundWrong = document.getElementById('sound-wrong');
        const soundYay = document.getElementById('sound-yay');
        const feedback = document.getElementById('feedback-overlay');
        const dots = document.querySelectorAll('.progress-dot');

        function updateQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerHTML = q.text;
            
            // Randomize left/right
            const isSwapped = Math.random() > 0.5;
            const opt1 = isSwapped ? q.options[1] : q.options[0];
            const opt2 = isSwapped ? q.options[0] : q.options[1];

            // Render Option 1
            const item1 = document.getElementById('item-1');
            if (opt1.type === "img") {
                item1.innerHTML = `<img src="${opt1.content}">`;
            } else {
                item1.innerHTML = opt1.emoji;
            }
            item1.className = 'item ' + opt1.size;
            document.getElementById('label-1').innerHTML = opt1.label;
            document.getElementById('option-1').setAttribute('onclick', `checkAnswer(${isSwapped ? 1 : 0})`);

            // Render Option 2
            const item2 = document.getElementById('item-2');
            if (opt2.type === "img") {
                item2.innerHTML = `<img src="${opt2.content}">`;
            } else {
                item2.innerHTML = opt2.emoji;
            }
            item2.className = 'item ' + opt2.size;
            document.getElementById('label-2').innerHTML = opt2.label;
            document.getElementById('option-2').setAttribute('onclick', `checkAnswer(${isSwapped ? 0 : 1})`);
            
            dots.forEach((dot, index) => {
                dot.className = 'progress-dot' + (index < currentQuestion ? ' completed' : (index === currentQuestion ? ' active' : ''));
            });

            // Play Question Audio
            if (q.audioId) {
                const audio = document.getElementById(q.audioId);
                audio.play().catch(() => {});
            }
        }

        function checkAnswer(index) {
            if (!canClick) return;
            canClick = false;

            const isCorrect = questions[currentQuestion].options[index].correct;

            if (isCorrect) {
                soundCorrect.play();
                feedback.innerHTML = "✅";
                feedback.classList.add('show');
                
                setTimeout(() => {
                    feedback.classList.remove('show');
                    currentQuestion++;
                    if (currentQuestion < questions.length) {
                        updateQuestion();
                        canClick = true;
                    } else {
                        winGame();
                    }
                }, 1000);
            } else {
                soundWrong.play();
                feedback.innerHTML = "❌";
                feedback.classList.add('show');
                
                const container = index === 0 ? document.getElementById('option-1') : document.getElementById('option-2');
                container.style.animation = 'shake 0.5s';
                
                setTimeout(() => {
                    feedback.classList.remove('show');
                    container.style.animation = '';
                    canClick = true;
                }, 1000);
            }
        }

        function winGame() {
            soundYay.play();
            const voTahniah = document.getElementById('vo-tahniah');
            
            // Play Tahniah voice-over ONLY after the initial "Yay" sound effect ends
            soundYay.onended = () => {
                voTahniah.play().catch(() => {});
            };
            
            dots[3].className = 'progress-dot completed';
            setTimeout(() => {
                document.getElementById('victory-popup').style.display = 'flex';
            }, 500);
        }

        // Add shake animation dynamic
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);

        window.onload = updateQuestion;
    </script>
    <!-- Background Music -->
    <audio id="bg-music" loop src="assets/audio/bckgrnd music.mp3"></audio>
    <script>
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.3;
        const savedTime = localStorage.getItem('bgMusicTime');
        if (savedTime) bgMusic.currentTime = parseFloat(savedTime);
        const playMusic = () => {
            bgMusic.play().catch(() => {
                document.addEventListener('click', () => bgMusic.play(), { once: true });
            });
        };
        playMusic();
        setInterval(() => { localStorage.setItem('bgMusicTime', bgMusic.currentTime); }, 1000);

        // Hover sound for all interactive elements
        const hoverSound = document.createElement('audio');
        hoverSound.id = 'hover-sound';
        hoverSound.src = 'assets/audio/catch correct.mp3';
        document.body.appendChild(hoverSound);

        document.querySelectorAll('button, a, .mission-card, .option-card').forEach(el => {
            el.addEventListener('mouseenter', () => {
                hoverSound.currentTime = 0;
                hoverSound.play().catch(() => {});
            });
        });
    </script>
</body>

</html>
