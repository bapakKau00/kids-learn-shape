<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Eby - Mula Radar! 📡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coiny&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('page 4.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Coiny', system-ui;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            background: #ff4081; /* Pink for Back */
            z-index: 10;
        }

        .back-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }

        /* Instructions */
        .instruction-tag {
            position: absolute;
            top: 100px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: #4caf50;
            font-size: 1.5rem;
            z-index: 5;
            border: 3px solid #4caf50;
        }

        /* Animated Box Container */
        .box-wrapper {
            width: 300px;
            height: 300px;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 5;
            margin-top: 100px;
        }

        svg#box-svg {
            width: 100%;
            height: 100%;
        }

        /* Animation Classes for Detective Box */
        .lid {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .box-wrapper.open .lid-top {
            transform: translateY(-50px) rotateX(45deg);
            opacity: 0.8;
        }

        /* Draggable Shapes */
        .shape-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%; /* Round Shape */
            background: radial-gradient(circle at 30% 30%, var(--color), #000);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: grab;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 2rem;
            border: 4px solid white;
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none;
            touch-action: none;
        }

        .shape:active {
            cursor: grabbing;
            transform: scale(1.1);
            z-index: 100;
        }

        .shape.sorting {
            transform: scale(0) translate(0, 100px);
            opacity: 0;
            transition: all 0.5s ease-in;
        }
    </style>
</head>
<body>
    <a href="radar.html" class="back-button">Kembali</a>
    <div class="instruction-tag">Masukkan Bentuk Bulat ke dalam Kotak! 🔵</div>

    <div class="shape-container" id="game-space">
        <!-- Draggable items will be here -->
        <div class="shape" style="--color: #FF5252; top: 20%; left: 15%;" onpointerdown="startDrag(event)">⚽</div>
        <div class="shape" style="--color: #FFEB3B; top: 25%; left: 75%;" onpointerdown="startDrag(event)">🍊</div>
        <div class="shape" style="--color: #4CAF50; top: 60%; left: 10%;" onpointerdown="startDrag(event)">🎾</div>
        <div class="shape" style="--color: #2196F3; top: 65%; left: 80%;" onpointerdown="startDrag(event)">🍩</div>
    </div>

    <div class="box-wrapper" id="box-container">
        <svg id="box-svg" viewBox="190 90 120 100" version="1.1" xmlns="http://www.w3.org/2000/svg">
            <g id="OBJECTS">
                <g>
                    <ellipse style="fill:#C8E6EB;" cx="250" cy="174.934" rx="56.059" ry="5.192"/>
                    <g>
                        <!-- Box Body -->
                        <polygon style="fill:#C47212;" points="230.955,103.212 296.266,107.195 296.266,174.486 230.955,170.504"/>
                        <polygon style="fill:#D77D14;" points="230.955,103.212 204.489,107.195 204.489,174.486 230.955,170.504"/>
                        <polygon style="fill:#E69632;" points="269.8,178.469 204.489,174.486 204.489,107.195 269.8,111.177"/>
                        <polygon style="fill:#D77D14;" points="269.8,178.469 296.266,174.486 296.266,107.195 269.8,111.177"/>
                        
                        <!-- Lid / Flaps Group -->
                        <g class="lid lid-top">
                            <polygon style="fill:#D77D14;" points="230.096,95.174 201.986,99.404 201.986,114.173 230.096,109.943"/>
                            <polygon style="fill:#C47212;" points="230.096,95.174 297.873,99.404 297.873,114.173 230.096,109.943"/>
                            <polygon style="fill:#E69632;" points="269.762,118.403 201.986,114.173 201.986,99.404 269.762,103.633"/>
                            <polygon style="fill:#D77D14;" points="269.762,118.403 297.873,114.173 297.873,99.404 269.762,103.633"/>
                            <polygon style="fill:#FFAE55;" points="201.986,99.404 230.096,95.174 297.873,99.404 269.762,103.633"/>
                        </g>
                    </g>
                </g>
            </g>
        </svg>
    </div>

    <script>
        let dragItem = null;
        let offsetX, offsetY;
        const box = document.getElementById('box-container');

        function startDrag(e) {
            dragItem = e.target;
            const rect = dragItem.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            
            dragItem.setPointerCapture(e.pointerId);
            dragItem.onpointermove = doDrag;
            dragItem.onpointerup = endDrag;
        }

        function doDrag(e) {
            if (!dragItem) return;
            
            const x = e.clientX - offsetX;
            const y = e.clientY - offsetY;
            
            dragItem.style.left = x + 'px';
            dragItem.style.top = y + 'px';

            // Collision Detection
            const boxRect = box.getBoundingClientRect();
            const itemRect = dragItem.getBoundingClientRect();

            if (
                itemRect.right > boxRect.left &&
                itemRect.left < boxRect.right &&
                itemRect.bottom > boxRect.top &&
                itemRect.top < boxRect.bottom
            ) {
                box.classList.add('open');
            } else {
                box.classList.remove('open');
            }
        }

        function endDrag(e) {
            if (!dragItem) return;

            const boxRect = box.getBoundingClientRect();
            const itemRect = dragItem.getBoundingClientRect();

            // Simple "Suck-in" check on drop
            if (
                itemRect.right > boxRect.left &&
                itemRect.left < boxRect.right &&
                itemRect.bottom > boxRect.top &&
                itemRect.top < boxRect.bottom
            ) {
                // Success! Sort the item
                dragItem.classList.add('sorting');
                setTimeout(() => {
                    dragItem.remove();
                    dragItem = null;
                    box.classList.remove('open');
                    checkWin();
                }, 500);
            } else {
                dragItem.onpointermove = null;
                dragItem.onpointerup = null;
                dragItem = null;
                box.classList.remove('open');
            }
        }

        function checkWin() {
            const remaining = document.querySelectorAll('.shape:not(.sorting)');
            if (remaining.length === 0) {
                document.querySelector('.instruction-tag').innerHTML = "Bagus! Kamu Hebat! ⭐⭐⭐";
                setTimeout(() => {
                    window.location.href = "next.html";
                }, 2000);
            }
        }
    </script>
</body>
</html>
