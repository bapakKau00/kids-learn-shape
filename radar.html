<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Eby - Radar Bentuk 📡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coiny&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Coiny', system-ui;
        }

        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #bg-video.loaded {
            opacity: 1;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: white;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
            background: #ff4081; /* Pink for Back */
            font-family: 'Coiny', system-ui;
            z-index: 10;
        }

        .back-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }
        /* Action Buttons at the bottom */
        .button-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            z-index: 20;
        }

        .action-button {
            text-decoration: none;
            color: #020202;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            background: #ffffff;
            font-family: 'Coiny', system-ui;
            border: none;
            animation: pulse 2s infinite ease-in-out;
            cursor: pointer;
        }

        .action-button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>

<body>
    <video autoplay muted playsinline id="bg-video">
        <source src="assets/videos/page 3 vid.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <a href="next.html" class="back-button">Menu Utama</a>

    <div class="button-container">
        <!-- Start Button -->
        <a href="radar-start.html" class="action-button" style="--btn-color: #4caf50;">
            <span></span>
            Jom Mula
        </a>
    </div>

    <audio id="vo-title" src="assets/audio/misi 1/radar bentuk.ogg"></audio>

    <audio id="bg-music" loop src="assets/audio/bckgrnd music.mp3"></audio>
    <script>
        const video = document.getElementById('bg-video');
        const voTitle = document.getElementById('vo-title');
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.3;

        const savedTime = localStorage.getItem('bgMusicTime');
        if (savedTime) bgMusic.currentTime = parseFloat(savedTime);

        const playMusic = () => {
            bgMusic.play().catch(() => {
                document.addEventListener('click', () => bgMusic.play(), { once: true });
            });
        };
        playMusic();
        setInterval(() => { localStorage.setItem('bgMusicTime', bgMusic.currentTime); }, 1000);

        // Hover sound for all interactive elements
        const hoverSound = document.createElement('audio');
        hoverSound.id = 'hover-sound';
        hoverSound.src = 'assets/audio/catch correct.mp3';
        document.body.appendChild(hoverSound);

        document.querySelectorAll('button, a, .mission-card').forEach(el => {
            el.addEventListener('mouseenter', () => {
                hoverSound.currentTime = 0;
                hoverSound.play().catch(() => {});
            });
        });

        // Play title audio on load
        window.addEventListener('load', () => {
            voTitle.play().catch(error => {
                console.log("Autoplay prevented. Audio will play on first interaction.");
            });
        });

        // Smoothly fade in when metadata is ready
        video.addEventListener('loadedmetadata', () => {
            video.classList.add('loaded');
        });

        // Precision Loop Handler
        video.ontimeupdate = function () {
            // Buffer of 0.2 seconds before the end to avoid the "jump"
            if (this.currentTime > this.duration - 0.2) {
                this.currentTime = 0;
                this.play();
            }
        };

        // Fallback for standard loop
        video.onended = function () {
            this.currentTime = 0;
            this.play();
        };
    </script>
</body>

</html>
